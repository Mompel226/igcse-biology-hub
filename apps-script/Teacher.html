    function oneClass(){ return hState.rows.length===1?hState.rows[0].cls:''; }
    function classPupils(){ var c=oneClass(); return c?STUD.filter(function(s){return s.cls===c;}):[]; }
    function ready(){ return hState.rows.length && hState.rows.every(function(r){return r.cls&&r.due;}); }
    /* The server words the date and decides overdue/soon in the SCHOOL's timezone, so the browser
       does no date arithmetic at all — it cannot disagree about which day it is. */
    function fmtD(h){ return h.dueText || '—'; }
    function dueCls(h){ return h.overdue ? 'over' : (h.soon ? 'soon' : ''); }

    function paint(){
      var warn='';
      if (!D.hubSet) warn='<div class="warn">The hub address is not set, so the parts of each lab cannot be listed. Set it in 🧪 Biology Labs ▸ 🔗 Teacher page.</div>';
      else if (!D.manifestOk) warn='<div class="warn">The station list could not be read from the hub. Run tools/stations-manifest.mjs, publish the site, then Refresh.</div>';
      var classes={}; STUD.forEach(function(s){ if(s.cls)classes[s.cls]=1; });
      var names=Object.keys(classes).sort(cmpClass);
      function opts(sel){ return '<option value="">Choose a class…</option>'+names.map(function(c){return '<option value="'+esc(c)+'"'+(c===sel?' selected':'')+'>'+esc(c)+'</option>';}).join(''); }
      var crows=hState.rows.map(function(r,i){
        return '<div class="bar2" style="margin:0 0 8px;padding:12px 14px">'+
          '<div class="fld" style="flex:0 0 180px"><label for="hc'+i+'">Class</label>'+
            '<select id="hc'+i+'" data-cls="'+i+'">'+opts(r.cls)+'</select></div>'+
          '<div class="fld" style="flex:0 0 180px"><label for="hd'+i+'">Due</label>'+
            '<input id="hd'+i+'" type="date" data-due="'+i+'" value="'+esc(r.due||'')+'"></div>'+
          (hState.rows.length>1?'<button class="act" data-rmrow="'+i+'">Remove</button>':'')+'</div>'; }).join('');
      var pupils=classPupils();
      var pbox = (oneClass()&&pupils.length)
        ? '<label class="ck" style="margin:2px 0 8px"><input type="checkbox" id="whole"'+(hState.whole?' checked':'')+'><span>Everyone in '+esc(oneClass())+'</span></label>'+
          (hState.whole?'':'<div class="pups">'+pupils.map(function(x){
            return '<label class="pup"><input type="checkbox" data-pup="'+esc(x.email)+'"'+(hState.pick[x.email]?' checked':'')+'><span>'+esc(x.name||x.email)+'</span></label>'; }).join('')+'</div>')
        : '';
      var labs=LABS.map(function(l){ var mine=hState.picked[l.id]||{}, n=0,q=0;
        (l.stations||[]).forEach(function(x){ if(mine[x.id]){n++;q+=x.questions;} });
        var all=n&&n===(l.stations||[]).length, op=!!hState.open[l.id];
        return '<div class="lab'+(op?' is-open':'')+'"><div class="lab__h" role="button" tabindex="0" aria-expanded="'+(op?'true':'false')+'" data-lab="'+esc(l.id)+'">'+
          '<svg class="car" width="12" height="12" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'+
          '<span class="lab__n">'+esc(l.name)+'</span><span class="lab__t">'+esc(l.topic||'')+'</span>'+
          '<span class="lab__c'+(n?' on':'')+'">'+(n?n+' of '+(l.stations||[]).length+' · '+q+'q':(l.stations||[]).length+' stations')+'</span>'+
          '<button class="act" data-all="'+esc(l.id)+'">'+(all?'None':'All')+'</button></div>'+
          (op?'<div class="stn">'+(l.stations||[]).map(function(x){ var on=!!mine[x.id];
            return '<label class="st'+(on?' on':'')+'"><input type="checkbox" data-pick="'+esc(l.id)+'|'+esc(x.id)+'"'+(on?' checked':'')+'>'+
              '<span>'+esc(x.name)+'</span><span class="st__q">'+x.questions+'</span></label>'; }).join('')+'</div>':'')+'</div>'; }).join('');
      var p=picked(), nC=hState.rows.filter(function(r){return r.cls;}).length;
      var nP=oneClass()?(hState.whole?pupils.length:Object.keys(hState.pick).length):0;
      var hint=p.questions?('About '+Math.max(5,r0(p.questions*0.8))+' minutes of practice'+
        (nP?' for '+nP+' student'+(nP===1?'':'s'):(nC>1?' for '+nC+' classes':''))+'. Short, focused tasks beat long ones.')
        :(EN?'Open a lab or a Bio English topic and tick what you have taught.':'Open a lab and tick the stations you have taught.');
      var builder = !LABS.length && !EN
        ? '<div class="empty">No labs are ready to set yet.</div>'
        : '<div class="bar2" style="display:block"><div class="fld" style="margin-bottom:12px"><label for="ht">Title</label>'+
          '<input id="ht" type="text" maxlength="120" placeholder="e.g. Digestion — the gut, before Friday" value="'+esc(hState.title)+'"></div>'+
          '<div class="fld"><label>Who, and by when</label></div>'+crows+
          '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><button class="act" id="addrow">+ Another class</button>'+
          (hState.rows.length>1?'<span class="size__k">each class gets its own date, and its own Classroom post</span>':'')+'</div>'+
          pbox+
          '<div class="fld" style="margin-top:14px"><label>What to practise</label><div class="labs">'+labs+'</div></div>'+enBlock()+
          '<div class="size"><span class="size__n">'+p.stations+'</span><span class="size__k">lab station'+(p.stations===1?'':'s')+'</span>'+
          (EN?'<span class="size__n">'+p.sets+'</span><span class="size__k">English set'+(p.sets===1?'':'s')+'</span>':'')+
          '<span class="size__n">'+p.questions+'</span><span class="size__k">questions</span><span class="size__h">'+esc(hint)+'</span></div>'+
          '<label class="ck" style="margin-top:14px"><input type="checkbox" id="hpost"'+(hState.post&&D.classroomOk?' checked':'')+(D.classroomOk?'':' disabled')+'>'+
          '<span>Post it in Google Classroom too'+(D.classroomOk?'':' — Google Classroom is not switched on in the script')+'</span></label>'+
          '<div style="margin-top:14px"><button class="go" id="hset"'+(p.any&&ready()?'':' disabled')+'>'+
          (hState.rows.length>1?'Set for '+hState.rows.length+' classes':'Set homework')+'</button></div><div class="msg" id="hmsg"></div></div>';
      var list = !HW.length ? '<div class="empty">Nothing set yet.</div>' : HW.map(function(h){
        var n=h.pupils.length, d=h.tally.done, pa=h.tally.partly, z=h.tally.none, op=!!hState.expand[h.id];
        var w=n||1;   /* nobody left is "nobody left", not "0 of 1 done" */
        var churn=(h.gone?'<span class="churn">'+h.gone+' left</span>':'')+(h.joined?'<span class="churn">'+h.joined+' joined since</span>':'');
        return '<div class="hw"><div class="hw__h" role="button" tabindex="0" aria-expanded="'+(op?'true':'false')+'" data-hw="'+esc(h.id)+'">'+
          '<div class="hw__m"><div class="hw__t">'+esc(h.title)+'</div><div class="hw__s">'+esc(h.who)+' · '+esc(h.what)+
          (h.teacher&&h.teacher!==BOOT.email?' · set by '+esc(h.teacher):'')+churn+'</div></div>'+
          '<div class="bars" data-tip="'+d+' done, '+pa+' part way, '+z+' not started"><i class="d" style="width:'+(100*d/w)+'%"></i>'+
          '<i class="p" style="width:'+(100*pa/w)+'%"></i><i class="z" style="width:'+(n?100*z/w:100)+'%"></i></div>'+
          '<div class="hw__k">'+(n? d+' of '+n+' done' : 'nobody left')+'</div>'+
          '<div class="hw__due '+dueCls(h)+'"><b>'+esc(fmtD(h))+'</b>due</div></div>'+
          (op?'<div class="hw__b">'+(h.pupils.map(function(x){
            return '<div class="prow"><div class="prow__n">'+esc(x.name||'(no name)')+'<span>'+esc(x.cls||'')+'</span></div>'+
              '<div class="prow__v" style="color:'+(x.state==='done'?'var(--good)':x.state==='partly'?'var(--warn)':'var(--mute)')+'">'+x.done+'/'+x.total+'</div>'+
              '<div><span class="st-pill '+esc(x.state)+'">'+(x.state==='none'?'not started':x.state)+'</span></div></div>'; }).join('')
            ||'<div class="empty">Nobody on the roster matches this any more.</div>')+
            (h.missing&&h.missing.length?'<div class="gone">Not scored: '+esc(h.missing.join(', '))+' — that part is no longer in the lab, so it is left out rather than counted as nothing done.</div>':'')+
            '<div class="acts"><button class="act" data-again="'+esc(h.id)+'">Set again</button>'+
            (hState.confirmDel===h.id
              ? '<button class="act danger" data-del="'+esc(h.id)+'">Yes, remove it</button><button class="act" data-keep="1">Keep it</button>'
              : '<button class="act danger" data-ask="'+esc(h.id)+'">Remove</button>')+'</div></div>':'')+'</div>'; }).join('');
      $('view').innerHTML = warn+
        '<section class="sec"><div class="sec__h"><span class="sec__t">New homework</span></div>'+
        '<p class="sec__d">Practice works best on something already taught. Tick only the stations you have covered.</p>'+builder+'</section>'+
        '<section class="sec"><div class="sec__h"><span class="sec__t">What you have set</span></div>'+
        '<p class="sec__d">Open one to see each student. “Set again” refills the form above.</p>'+list+'</section>';
      wireH();
    }
    function say(t,bad){ var m=$('hmsg'); if(m){ m.textContent=t||''; m.className='msg'+(t?(bad?' bad':' ok'):''); } }
    function wireH(){
      var ht=$('ht'); if(ht) ht.addEventListener('input', function(){ hState.title=ht.value; });
      document.querySelectorAll('[data-cls]').forEach(function(sel){ sel.addEventListener('change', function(){
        hState.rows[+sel.getAttribute('data-cls')].cls=sel.value;
        if(hState.rows.length===1){hState.whole=true;hState.pick={};} paint(); }); });
      document.querySelectorAll('[data-due]').forEach(function(i){ i.addEventListener('input', function(){
        hState.rows[+i.getAttribute('data-due')].due=i.value;
        var g=$('hset'); if(g) g.disabled=!(picked().any&&ready()&&(hState.whole||Object.keys(hState.pick).length)); }); });
      var ar=$('addrow'); if(ar) ar.addEventListener('click', function(){ hState.rows.push({cls:'',due:''}); hState.whole=true; hState.pick={}; paint(); });
      document.querySelectorAll('[data-rmrow]').forEach(function(b){ b.addEventListener('click', function(){ hState.rows.splice(+b.getAttribute('data-rmrow'),1); paint(); }); });
      var w=$('whole'); if(w) w.addEventListener('change', function(){ hState.whole=w.checked; paint(); });
      document.querySelectorAll('[data-pup]').forEach(function(b){ b.addEventListener('change', function(){
        if(b.checked) hState.pick[b.getAttribute('data-pup')]=1; else delete hState.pick[b.getAttribute('data-pup')];
        var g=$('hset'); if(g) g.disabled=!(picked().any&&ready()&&(hState.whole||Object.keys(hState.pick).length)); }); });
      document.querySelectorAll('.lab__h[data-lab]').forEach(function(h){ h.addEventListener('click', function(ev){
        if(ev.target.closest('[data-all]')) return;
        var id=h.getAttribute('data-lab'); hState.open[id]=!hState.open[id]; paint(); }); });
      document.querySelectorAll('[data-all]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
        var id=b.getAttribute('data-all'), lab=null; LABS.forEach(function(l){ if(l.id===id) lab=l; });
        if(!lab) return; var mine=hState.picked[id]||{};
        var all=(lab.stations||[]).length>0 && (lab.stations||[]).every(function(x){ return mine[x.id]; });
        hState.picked[id]={}; if(!all)(lab.stations||[]).forEach(function(x){ hState.picked[id][x.id]=1; }); paint(); }); });
      document.querySelectorAll('[data-pick]').forEach(function(b){ b.addEventListener('change', function(){
        var q=b.getAttribute('data-pick').split('|'); hState.picked[q[0]]=hState.picked[q[0]]||{};
        if(b.checked) hState.picked[q[0]][q[1]]=1; else delete hState.picked[q[0]][q[1]]; paint(); }); });
      document.querySelectorAll('.hw__h').forEach(function(h){ h.addEventListener('click', function(){
        var id=h.getAttribute('data-hw'); hState.expand[id]=!hState.expand[id]; paint(); }); });
      document.querySelectorAll('[data-again]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
        var id=b.getAttribute('data-again'), h=null; HW.forEach(function(x){ if(x.id===id) h=x; });
        if(!h) return; hState.picked={}; hState.open={};
        (h.tasks||[]).forEach(function(t){ hState.picked[t.labId]={}; (t.stationIds||[]).forEach(function(x){ hState.picked[t.labId][x]=1; }); hState.open[t.labId]=true; });
        Object.keys(hState.picked[ENID]||{}).forEach(function(id){ var x=ENS[id]; if(!x) return;
          hState.open['en:'+(x.unit||'how')]=true;
          if(x.unit&&EN) (EN.years||[]).forEach(function(y){ if((y.units||[]).indexOf(x.unit)>=0) hState.enYr=String(y.y); }); });
        var was=(h.targets&&h.targets.cls)||'';
        /* only carry the class over if it still exists, or the box shows "Choose a class…" while
           the state still holds the old one and Set would write homework nobody is in */
        hState.title=h.title; hState.rows=[{cls:(names.indexOf(was)>=0?was:''),due:''}]; hState.whole=true; hState.pick={};
        paint(); var t=$('ht'); if(t){ t.focus(); t.scrollIntoView({behavior:'smooth',block:'center'}); } }); });
      document.querySelectorAll('[data-ask]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
        hState.confirmDel=b.getAttribute('data-ask'); paint(); }); });
      document.querySelectorAll('[data-keep]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
        hState.confirmDel=null; paint(); }); });
      document.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
        hState.confirmDel=null; send('homeworkDelete', b.getAttribute('data-del')); }); });
      document.querySelectorAll('[data-enyr]').forEach(function(b){ b.addEventListener('click', function(){ hState.enYr=b.getAttribute('data-enyr'); paint(); }); });
      document.querySelectorAll('[data-enu]').forEach(function(h){ h.addEventListener('click', function(ev){
        if(ev.target.closest('[data-enall]')) return;
        var k='en:'+h.getAttribute('data-enu'); hState.open[k]=!hState.open[k]; paint(); }); });
      document.querySelectorAll('[data-enall]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
        var ids=enIds(b.getAttribute('data-enall')), mine=hState.picked[ENID]=hState.picked[ENID]||{};
        var all=ids.length>0&&ids.every(function(id){ return mine[id]; });
        ids.forEach(function(id){ if(all) delete mine[id]; else mine[id]=1; }); paint(); }); });
      document.querySelectorAll('[data-enkind]').forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
        var q=b.getAttribute('data-enkind').split('|'), ids=enIds(q[0]).filter(function(id){ return ENS[id].kind===q[1]; });
        var mine=hState.picked[ENID]=hState.picked[ENID]||{}; var all=ids.length>0&&ids.every(function(id){ return mine[id]; });
        ids.forEach(function(id){ if(all) delete mine[id]; else mine[id]=1; }); paint(); }); });
      document.querySelectorAll('[data-enpick]').forEach(function(b){ b.addEventListener('change', function(){
        var mine=hState.picked[ENID]=hState.picked[ENID]||{}, id=b.getAttribute('data-enpick');
        if(b.checked) mine[id]=1; else delete mine[id]; paint(); }); });
      var hp=$('hpost'); if(hp) hp.addEventListener('change', function(){ hState.post=hp.checked; });
      var g=$('hset'); if(g) g.addEventListener('click', submit);
    }
    function send(fn, arg){
      if (hState.busy) return; hState.busy=true;
      google.script.run.withSuccessHandler(function(r){ hState.busy=false;
          if(r&&r.ok){ D=r.data; HW=D.homework||[]; STUD=D.students||[]; LABS=D.labs||[]; useEn();
            V.put('homework', {ok:true, data:D}); paint(); }
          else say((r&&r.why)||'That did not work.', true); })
        .withFailureHandler(function(){ hState.busy=false; say('That did not work.', true); })[fn](arg);
    }
    function submit(){
      if (hState.busy) return;
      var p=picked();
      if(!p.any) return say('Tick at least one lab station or English set.', true);
      if(!ready()) return say('Every class needs a date.', true);
      if(!hState.title.trim()) return say('Give it a title.', true);
      var ind = oneClass() && !hState.whole, emails = ind?Object.keys(hState.pick):[];
      if (ind && !emails.length) return say('Tick the students it is for, or choose everyone.', true);
      hState.busy=true; say('Setting…');
      google.script.run
        .withSuccessHandler(function(r){ hState.busy=false;
          if(r&&r.ok){ D=r.data; HW=D.homework||[]; STUD=D.students||[]; LABS=D.labs||[]; useEn();
            V.put('homework', {ok:true, data:D});      /* or leaving the tab shows the list from before */
            hState.title=''; hState.picked={}; hState.pick={}; hState.whole=true; hState.rows=[{cls:'',due:''}];
            var m=r.made&&r.made.length>1?('Set for '+r.made.length+' classes.'):'Set.';
            if(r.posted&&r.posted.length) m+=' Posted in Google Classroom for '+r.posted.join(', ')+'.';
            if(r.notPosted&&r.notPosted.length) m+=' Not posted in Classroom — '+r.notPosted.join('; ')+'.';
            paint(); say(m, !!(r.notPosted&&r.notPosted.length)); }
          else say((r&&r.why)||'Could not set it.', true); })
        .withFailureHandler(function(){ hState.busy=false; say('Could not set it.', true); })
        .homeworkCreate({ title:hState.title.trim(), tasks:p.tasks, post:!!(hState.post&&D.classroomOk),
          /* send the plain date; the server pins it to the end of that day in the school's zone */
          classes:hState.rows.map(function(r){ return ind?{cls:'',due:r.due,emails:emails}:{cls:r.cls,due:r.due,emails:[]}; }) });
    }
    paint();
  };
})();
</script>
</body>
</html>
