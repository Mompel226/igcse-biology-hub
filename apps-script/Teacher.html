    /* ── each question as a square (6 Oct 2026, Daniel: "so that I know exactly where the students had to check
       multiple times") ── The letters come with Lab progress: e.q[station] = the FIRST round (f right first time,
       1 right after more checks, t tried and not right, 0 not tried), e.b[station] = the best ever where it differs.
       A lab's question words are asked for only when a teacher opens one of its stations, then kept for this tab. */
    var SQ = { f:['f','right first time'], '1':['m','right after more checks'], t:['t','tried, not right yet'], '0':['z','not tried'] };
    function sqKey(){
      return '<div class="sqkey"><span><i style="background:var(--good)"></i>right first time</span>'+
        '<span><i style="background:var(--warn)"></i>right after more checks</span>'+
        '<span><i style="background:var(--bad)"></i>tried, not right yet</span>'+
        '<span><i style="border:1px solid var(--line2)"></i>not tried</span>'+
        '<span><i style="background:repeating-linear-gradient(135deg,var(--track2) 0 2px,transparent 2px 4px);border:1px solid var(--line2)"></i>not kept (before 7 Oct 2026)</span>'+
        '<span><i style="background:var(--good);border-radius:50%"></i>right in a later round</span></div>'; }
    /* ── rounds (7 Oct 2026, Daniel: "a total checks per question, no matter the number of rounds, and per round … if they're
       failing the same questions despite the rounds") ── e.rd[station]: every round, oldest first, the round they are on
       last; each "<letters>.<checks>[*k]": the letters of the squares, then the checks at each question (0–9, a = 10 … z = 35
       or more), "*k" for k rounds kept together. Round 1's letters come from e.q, the record Right first time is read from. */
    var B36='0123456789abcdefghijklmnopqrstuvwxyz';
    function rTok(t){ var m=String(t==null?'':t).match(/^([01tf]*)\.([0-9a-z]*)(?:\*(\d+))?$/);
      return m?{l:m[1],c:m[2],k:m[3]?Math.max(1,+m[3]):1}:{l:'',c:'',k:1}; }
    function rN(ch){ var i=B36.indexOf(ch||''); return i<0?0:i; }
    function roundsOf(list, n, q){
      var out=[], at=1, i, tot=[], again=[], redo=[];
      (list||[]).forEach(function(t){ var x=rTok(t); x.a=at; at+=x.k; out.push(x); });
      /* round 1's letters from e.q, the record Right first time reads; all "0" there means not recorded, not "nothing tried"
         (the second audit, 7 Oct 2026) */
      if (q&&/[^0]/.test(q)&&out.length&&out[0].a===1&&out[0].k===1) out[0].l=q;
      for(i=0;i<n;i++){ tot.push(0); again.push(false); redo.push(false); }
      var r1=out.length?out[0].l:'';
      out.forEach(function(x,j){ for(i=0;i<n;i++){ tot[i]+=rN(x.c.charAt(i));
        if(!j) continue;
        var c=x.l.charAt(i), f=r1.charAt(i);
        if(c&&c!=='0') redo[i]=true;
        if((c==='t'||c==='1')&&(f==='t'||f==='1')) again[i]=true; } });
      return { rounds:out, n:n, tot:tot, again:again, redo:redo, last:at-1 };
    }
    /* the rounds of one station in words, one line: what a teacher reads before pointing at a square. Round 1 and the
       round they are on are said in full; more than one round between them, together (the squares show each). */
    function roundsSay(R){
      var L=R.rounds, last=L.length-1;
      function one(x,j){
        var lbl=x.k>1?'Rounds '+x.a+'\u2013'+(x.a+x.k-1):'Round '+x.a;
        if(!x.l) return '<b>'+lbl+'</b>: answers not kept';
        var tr=0, ok=0, f=0, ck=0, i;
        for(i=0;i<R.n;i++){ var c=x.l.charAt(i); if(c&&c!=='0')tr++; if(c==='1'||c==='f')ok++; if(c==='f')f++; ck+=rN(x.c.charAt(i)); }
        return '<b>'+lbl+'</b>'+(j===last&&j>0?' (now)':'')+': '+tr+' of '+R.n+' tried, '+(j?ok+' right':f+' right first time')+(x.c?', '+ck+' check'+(ck===1?'':'s'):'');
      }
      if (L.length<=3) return L.map(one).join(' \u00b7 ');
      var mid=L.slice(1,last), a=mid[0].a, b=mid[mid.length-1].a+mid[mid.length-1].k-1, ck=0, known=false;
      mid.forEach(function(x){ if(x.c) known=true; for(var i=0;i<R.n;i++) ck+=rN(x.c.charAt(i)); });
      return one(L[0],0)+' \u00b7 <b>Rounds '+a+'\u2013'+b+'</b>: '+(b-a+1)+' rounds'+(known?', '+ck+' check'+(ck===1?'':'s'):'')+' (a row each above)'+' \u00b7 '+one(L[last],last);
    }
    function roundGrid(R, rx){
      var n=R.n, i, ag=[];
      var head='<div class="rq__r rq__h"><span class="rq__l"></span>';
      for(i=0;i<n;i++){ if(R.again[i]) ag.push(i+1);
        head+='<span class="rq__q'+(R.again[i]?' ag':'')+'"'+(R.again[i]?' data-tip="Failed again: not right at the first check in round 1, and again not right at the first check in a later round."':'')+'>'+(i+1)+'</span>'; }
      head+='</div>';
      var rows=R.rounds.map(function(x,j){
        var lbl=x.k>1?'Rounds '+x.a+'\u2013'+(x.a+x.k-1):'Round '+x.a, now=j===R.rounds.length-1&&j>0;
        var tip=(x.k>1?'Rounds '+x.a+' to '+(x.a+x.k-1)+', kept together so the record stays small: each square is the best that question got in them; its number, every check in them.'
                :j===0?'Their first time through this station. Right first time and Stuck are counted from this round.'
                :'They started the station again and answered the questions again.')+
                (now?' The round they are on now.':'')+(!x.l?' What they answered in it was not kept: it was before 7 Oct 2026, when the lab began to keep every round.':'');
        var cells='';
        for(var i=0;i<n;i++){
          var c=x.l?(x.l.charAt(i)||'0'):'', k=c?(SQ[c]||SQ['0']):null, ck=x.c?rN(x.c.charAt(i)):null;
          cells+='<button type="button" class="sq '+(k?k[0]:'u')+'" data-q="'+i+'" data-r="'+j+'" data-rl="'+esc(lbl.toLowerCase())+'" data-l="'+esc(c)+'"'+
            ' data-c="'+(ck==null?'':ck)+'" data-t="'+R.tot[i]+'" data-ag="'+(R.again[i]?1:0)+'"'+
            ' aria-label="'+esc('Question '+(i+1)+', '+lbl.toLowerCase()+': '+(k?k[1]:'not kept')+(ck?', '+ck+' check'+(ck===1?'':'s'):''))+'">'+(ck?(ck>=35?'35+':ck):'')+'</button>';
        }
        return '<div class="rq__r"><span class="rq__l" data-tip="'+esc(tip)+'">'+esc(lbl)+(now?' <i>now</i>':'')+'</span>'+cells+'</div>'; }).join('');
      var all='';
      if (R.rounds.length>1){
        var mx=Math.max.apply(null, R.tot.concat([1]));
        all='<div class="rq__r"><span class="rq__l" data-tip="Every press of Check at each question, all rounds added up. The darker, the more checks.">All rounds</span>';
        for(i=0;i<n;i++){ var t=R.tot[i];
          all+='<span class="rq__t'+(R.again[i]?' ag':'')+'" style="--k:'+(t?(0.18+0.82*t/mx).toFixed(2):0)+'">'+(t||'')+'</span>'; }
        all+='</div>';
      }
      return '<div class="rq" role="group" aria-label="Each question, round by round">'+head+rows+all+'</div>'+
        '<p class="rq__s">'+roundsSay(R)+(ag.length?' \u00b7 <span class="agw">failed again: question'+(ag.length===1?' ':'s ')+ag.join(', ')+'</span>':'')+'</p>'+
        (rx?'<p class="rq__x">+'+rx+' check'+(rx===1?'':'s')+' at this station not split by question: made before 7 Oct 2026, when the lab began to count each question, or on an earlier version of the station.</p>':'');
    }
    function oneRow(q, b){
      b=b||q;
      return '<div class="sqs">'+q.split('').map(function(c,i){ var k=SQ[c]||SQ['0'], later=(c==='t'||c==='0')&&(b.charAt(i)==='1'||b.charAt(i)==='f');
        return '<button type="button" class="sq '+k[0]+(later?' later':'')+'" data-q="'+i+'" data-l="'+c+'" data-later="'+(later?1:0)+'"'+
          ' aria-label="Question '+(i+1)+': '+k[1]+(later?', right in a later round':'')+'">'+(i+1)+'</button>'; }).join('')+'</div>';
    }
    function dstRow(l, e, x){
      var p2=x.total?100*x.done/x.total:0, hh=heat(p2), q=has(e.q,x.name)?String(e.q[x.name]):null, rd=has(e.rd,x.name)&&Array.isArray(e.rd[x.name])?e.rd[x.name]:null, n=x.total||(q?q.length:0);
      var R=rd&&n?roundsOf(rd, n, q):null, agN=R?R.again.filter(Boolean).length:0, rx=has(e.rx,x.name)?(Number(e.rx[x.name])||0):0;
      var badges=(R&&R.last>1?'<span class="rbadge" data-tip="'+esc('They started this station again: it is on round '+R.last+'. Open it to compare the rounds.')+'">\u21ba '+R.last+'</span>':'')+
                 (agN?'<span class="rbadge ag" data-tip="'+esc(agN+' question'+(agN===1?'':'s')+' failed again: not right at the first check in round 1, and again not right at the first check in a later round.')+'">\u2715 '+agN+'</span>':'');
      var row='<span class="dst__n">'+((q||R)?'<span class="chev" aria-hidden="true">▸</span>':'')+esc(stName(l.id,x.name))+'</span>'+
        '<span class="dst__v">'+badges+'<span data-tip="'+esc('Their best: '+x.done+' of '+x.total+' right, in any round'+(x.checks?'; '+x.checks+' press'+(x.checks===1?'':'es')+' of Check here, every round':'')+'.')+'">'+x.done+'/'+x.total+(x.checks?' · '+x.checks+' check'+(x.checks===1?'':'s'):'')+'</span></span>'+
        '<span class="dst__bar"><i style="width:'+r0(p2)+'%;background:'+hh.bd+'"></i></span>';
      if (!q && !R) return '<div class="dst">'+row+'</div>';
      return '<details class="dqd" data-lab="'+esc(l.id)+'" data-st="'+esc(x.name)+'"><summary class="dst">'+row+'</summary>'+
        '<div class="dq">'+(R?roundGrid(R, rx):oneRow(q, has(e.b,x.name)?String(e.b[x.name]):null))+'<div class="dq__say" aria-live="polite"></div></div></details>';
    }
    var QW = window.__qWords || (window.__qWords = {}), QWAIT = {};
    function withWords(labId, cb){
      if (QW[labId]) return cb(QW[labId], '');
      try { var raw=sessionStorage.getItem('teach.q.'+labId), o=raw&&JSON.parse(raw);
        if (o&&o.w&&o.at&&(Date.now()-o.at)<60*60*1000) { QW[labId]=o.w; return cb(o.w, ''); } } catch(e){}
      if (QWAIT[labId]) { QWAIT[labId].push(cb); return; }
      QWAIT[labId]=[cb];
      google.script.run
        .withSuccessHandler(function(r){ var w=r&&r.ok&&r.data?r.data:null, cbs=QWAIT[labId]; delete QWAIT[labId];
          if (w) { QW[labId]=w; try { sessionStorage.setItem('teach.q.'+labId, JSON.stringify({at:Date.now(), w:w})); } catch(e){} }
          cbs.forEach(function(f){ f(w, w?'':((r&&r.why)||'the lab’s page could not be read')); }); })
        .withFailureHandler(function(err){ var cbs=QWAIT[labId]; delete QWAIT[labId];
          cbs.forEach(function(f){ f(null, (err&&err.message)||'the spreadsheet could not be reached'); }); })
        .uiData('questions', labId);
    }
    /* the line under the squares: the square pointed at; or else a question failed again, or else the first one not right
       first time in round 1 */
    function sayFor(d, btn){
      if (!d) return;
      var say=d.querySelector('.dq__say'), all=[].slice.call(d.querySelectorAll('.sq'));
      var first=all.filter(function(x){ return (x.getAttribute('data-r')||'0')==='0'; });
      if (!btn) btn=first.filter(function(x){ return x.getAttribute('data-ag')==='1'; })[0]||
                    first.filter(function(x){ var c=x.getAttribute('data-l'); return c==='1'||c==='t'; })[0]||null;
      all.forEach(function(x){ x.classList.toggle('on', x===btn); });
      if (!btn) { var nt=first.filter(function(x){ return x.getAttribute('data-l')==='0'; }).length;
        say.innerHTML = nt===first.length ? 'Nothing tried here in the first round yet. Point at a square to read its question.'
          : 'Every question they tried here was right first time'+(nt?' ('+nt+' not tried yet)':'')+'. Point at a square to read its question.'; return; }
      var i=+btn.getAttribute('data-q'), c0=btn.getAttribute('data-l'), k=c0?(SQ[c0]||SQ['0']):null, later=btn.getAttribute('data-later')==='1', head;
      if (btn.hasAttribute('data-r')) {
        var ck=btn.getAttribute('data-c'), t=+btn.getAttribute('data-t')||0, ag=btn.getAttribute('data-ag')==='1';
        head='<b>Question '+(i+1)+'</b> · '+esc(btn.getAttribute('data-rl'))+': '+esc(k?k[1]:'not kept (before 7 Oct 2026)')+
          (ck!==''?', '+ck+' check'+(ck==='1'?'':'s'):'')+(t&&all.length>first.length?' · all rounds: '+t+' check'+(t===1?'':'s'):'')+
          (ag?' · <span class="agw">failed again</span>':'');
      } else head='<b>Question '+(i+1)+'</b> · '+esc(k[1])+(later?' · right in a later round':'');
      say.innerHTML=head+'<br>…';
      withWords(d.getAttribute('data-lab'), function(w, why){
        if (!btn.classList.contains('on')) return;                 /* another square was pointed at meanwhile */
        var st=w&&w[d.getAttribute('data-st')], t=st&&st[i];
        say.innerHTML=head+'<br>'+(t?'“'+esc(t)+'”':esc(w?'The words of this question are not in the lab’s page now: the station has changed since.':'The question’s words could not be read: '+why));
      });
    }
    function wireSquares(box){
      if (!box) return;
      box.querySelectorAll('details.dqd').forEach(function(d){ d.addEventListener('toggle', function(){ if (d.open) sayFor(d, null); }); });
      box.querySelectorAll('.sq').forEach(function(b){

          return '<button type="button" class="ha-sq '+k[0]+(later?' later':'')+'" data-hpsi="'+si+'" data-hpq="'+i+'" aria-label="'+esc(tip)+'" data-tip="'+esc(tip)+'">'+(n>1?(n>=35?'35+':n):'')+'</button>'; }).join('')
        : '<span class="ha-dim">'+(haDid(c)?'Not shown question by question: their first round here was not kept (the part was rewritten since, or the work is older than that record).':'Not started.')+'</span>';
      return '<div class="ha-sqrow"><div class="ha-sqn">'+esc(s.name)+'<span>'+c.d+' of '+s.n+' done'+(s.kind==='wu'&&c.r!=null?' · red pen '+c.r+' of '+(s.m||0):'')+(c.p?' · ⏪ began before it was set':'')+'</span></div>'+
        '<div class="ha-sqs">'+sq+'</div><div class="ha-sqsay" data-hpsay="'+si+'"></div></div>'; }).join('');
    V.openDraw(p.name+(p.cls?' · '+p.cls:''), esc(h.title)+' · '+p.done+' of '+p.total+' done · '+haPc(f.r)+' right at the first try'+(f.t?' ('+f.f+' of '+f.t+')':''),
      '<div class="ha-dp"><div class="ha-dqbar">'+haAnsBtn()+'</div>'+rows+'<div class="ha-key"><span><i class="ha-sq f"></i> right first time</span><span><i class="ha-sq m"></i> right after more checks</span><span><i class="ha-sq t"></i> not right</span>'+
      '<span><i class="ha-sq s"></i> saw the answer</span><span><i class="ha-sq z"></i> not tried</span><span>each square: their first round · dot: right in a later round · number: checks</span></div></div>');
    var box = $('drawb'), active = null;
    var showOn = function(b){ var si=+b.getAttribute('data-hpsi'), q=+b.getAttribute('data-hpq'), s=h.secs[si], say=box.querySelector('[data-hpsay="'+si+'"]');
      var show = function(){ if (b.classList.contains('on') && say && haDrawRedo===redo) say.innerHTML = '<div class="ha-qw">Question '+(q+1)+'</div>'+haSheet(s, q); };
      show(); haWords(s, show); if (haState.ans) haAnsLoad(s, show); };
    var redo = function(){ var bar = box.querySelector('.ha-dqbar'); if (bar) bar.innerHTML = haAnsBtn(); if (active) showOn(active); };
    haDrawRedo = redo; haWireDraw();
    box.querySelectorAll('[data-hpsi]').forEach(function(b){ b.addEventListener('click', function(){
      box.querySelectorAll('.ha-sq.on').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); active = b; showOn(b); }); });
  }
  /* Set homework's "See how they did →" opens one homework here */
  window.haOpenFor = function(id, other){ haState.open = id; haState.cls='all'; haState.when='all'; haState.q=''; if (other) haState.whose='all'; };
})();
</script>
